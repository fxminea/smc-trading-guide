              <span>មាន SMT Divergence Confirmation (+2pts)</span>
            </label>
          </div>

          <div class="p-4 bg-slate-950 rounded-xl border border-slate-800 flex items-center justify-between">
            <div>
              <span class="text-xs text-slate-400">ពិន្ទុ Confluence សរុប:</span>
              <div id="conf-score-text" class="text-xl font-bold text-amber-400">0 / 10</div>
            </div>
            <div id="conf-status-badge" class="px-3 py-1 rounded-lg bg-slate-900 border border-slate-700 text-xs text-slate-400 font-bold">
              មិនទាន់គ្រប់គ្រាន់ (C Grade)
            </div>
          </div>
        </div>

        <!-- Tool 3: Trade Logger / Journal -->
        <div class="bg-darkCard border border-borderDark rounded-2xl p-5 space-y-4 shadow-xl">
          <div class="flex items-center justify-between pb-3 border-b border-slate-800">
            <div class="flex items-center gap-2">
              <div class="p-2 bg-sky-950 text-sky-400 rounded-xl border border-sky-800">
                <i data-lucide="book-open" class="w-5 h-5"></i>
              </div>
              <div>
                <h3 class="font-bold text-white text-base">៣. កត់ត្រា Trade Journal (Local Storage)</h3>
                <p class="text-xs text-slate-400">រក្សាទុកប្រវត្តិនៃការជួញដូររបស់អ្នក</p>
              </div>
            </div>
          </div>

          <!-- Add Form -->
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
            <input type="text" id="log-pair" placeholder="Pair (ឧ. EURUSD)" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none">
            <select id="log-type" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none">
              <option value="BUY">BUY 🟢</option>
              <option value="SELL">SELL 🔴</option>
            </select>
            <input type="text" id="log-rrr" placeholder="RRR (ឧ. 1:3)" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none">
            <select id="log-result" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none">
              <option value="WIN">WIN ✅</option>
              <option value="LOSS">LOSS ❌</option>
              <option value="BE">BREAKEVEN ⚖️</option>
            </select>
          </div>
          <button onclick="addTradeLog()" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-black font-bold rounded-xl text-xs transition flex items-center justify-center gap-1">
            <i data-lucide="plus" class="w-4 h-4"></i> បន្ថែមការកត់ត្រា Trade
          </button>

          <!-- Logs List -->
          <div id="logs-container" class="space-y-2 pt-2 max-h-60 overflow-y-auto">
            <!-- Dynamic logs -->
          </div>
        </div>

      </div>
    `,
    intermediate: ``,
    advanced: ``
  }
};

// Render active topic content
function renderCurrentTopic() {
  const data = smcTopicsData[currentTopicKey];
  if (!data) return;

  // Update Header Banner
  document.getElementById('topic-badge-num').innerText = `Topic ${data.num}`;
  document.getElementById('current-topic-title').innerHTML = `${data.title}`;
  document.getElementById('current-topic-subtitle').innerText = data.subtitle;

  // Toggle Level tabs visibility (Hide for Roadmap & Tools)
  const tabsContainer = document.getElementById('level-tabs-container');
  if (currentTopicKey === 'road' || currentTopicKey === 'tools') {
    tabsContainer.classList.add('hidden');
  } else {
    tabsContainer.classList.remove('hidden');
  }

  // Update Active Level Tab Styles
  ['beginner', 'intermediate', 'advanced'].forEach(lvl => {
    const btn = document.getElementById(`tab-lvl-${lvl}`);
    if (btn) {
      if (lvl === currentLevel) {
        btn.className = "lvl-btn py-2 text-xs sm:text-sm font-semibold rounded-lg transition flex items-center justify-center gap-1.5 bg-emerald-950 text-emerald-400 border border-emerald-700/50 shadow";
      } else {
        btn.className = "lvl-btn py-2 text-xs sm:text-sm font-semibold rounded-lg text-slate-400 hover:text-slate-200 transition flex items-center justify-center gap-1.5";
      }
    }
  });

  // Render HTML Content
  const contentDisplay = document.getElementById('main-content-display');
  const levelContent = data[currentLevel] || data['beginner'];
  contentDisplay.innerHTML = levelContent;

  // Highlight active buttons in navigation
  updateNavHighlights();
  updateBookmarkButtonUI();

  // Re-initialize Lucide Icons for dynamic content
  if (window.lucide) lucide.createIcons();

  // Initialize Calculator if on tools topic
  if (currentTopicKey === 'tools') {
    calculateRisk();
    renderTradeLogs();
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Navigation highlight helper
function updateNavHighlights() {
  document.querySelectorAll('.topic-nav-btn').forEach(btn => {
    btn.classList.remove('bg-emerald-900/60', 'text-emerald-400', 'border-emerald-500');
  });
  document.querySelectorAll('.side-nav-item').forEach(btn => {
    btn.classList.remove('bg-emerald-950/60', 'text-emerald-400', 'font-bold');
  });

  const activeNavBtn = document.getElementById(`nav-btn-${currentTopicKey}`);
  if (activeNavBtn) {
    activeNavBtn.classList.add('bg-emerald-900/60', 'text-emerald-400', 'border-emerald-500');
  }

  const activeSideBtn = document.getElementById(`side-${currentTopicKey}`);
  if (activeSideBtn) {
    activeSideBtn.classList.add('bg-emerald-950/60', 'text-emerald-400', 'font-bold');
  }
}

// Switch Topic Function
function switchTopic(topicKey) {
  currentTopicKey = topicKey;
  renderCurrentTopic();
}

// Select Difficulty Level
function selectLevel(level) {
  currentLevel = level;
  renderCurrentTopic();
}

// Bookmarking logic
function updateBookmarkButtonUI() {
  const isSaved = savedBookmarks.includes(currentTopicKey);
  const btnText = document.getElementById('bookmark-btn-text');
  const icon = document.getElementById('bookmark-icon');
  const badge = document.getElementById('bookmark-count-badge');

  if (btnText && icon) {
    if (isSaved) {
      btnText.innerText = "បានរក្សាទុក";
      icon.classList.add('fill-amber-400');
    } else {
      btnText.innerText = "រក្សាទុកមេរៀន";
      icon.classList.remove('fill-amber-400');
    }
  }

  if (badge) {
    if (savedBookmarks.length > 0) {
      badge.innerText = savedBookmarks.length;
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }
  }
}

function toggleBookmarkCurrent() {
  const index = savedBookmarks.indexOf(currentTopicKey);
  if (index > -1) {
    savedBookmarks.splice(index, 1);
  } else {
    savedBookmarks.push(currentTopicKey);
  }
  localStorage.setItem('smc_bookmarks', JSON.stringify(savedBookmarks));
  updateBookmarkButtonUI();
}

// Modals toggles
function toggleSearchModal() {
  const modal = document.getElementById('search-modal');
  modal.classList.toggle('hidden');
  if (!modal.classList.contains('hidden')) {
    document.getElementById('search-input').focus();
  }
}

function toggleBookmarksModal() {
  const modal = document.getElementById('bookmarks-modal');
  modal.classList.toggle('hidden');
  if (!modal.classList.contains('hidden')) {
    renderBookmarksList();
  }
}

function renderBookmarksList() {
  const container = document.getElementById('bookmarks-list');
  if (savedBookmarks.length === 0) {
    container.innerHTML = `<p class="text-xs text-slate-500 text-center py-6">គ្មានមេរៀនដែលបានរក្សាទុកនៅឡើយទេ</p>`;
    return;
  }

  let html = '';
  savedBookmarks.forEach(key => {
    const item = smcTopicsData[key];
    if (item) {
      html += `
        <div onclick="switchTopic('${key}'); toggleBookmarksModal();" class="p-3 bg-slate-950 border border-slate-800 hover:border-emerald-500 rounded-xl cursor-pointer transition flex items-center justify-between">
          <div>
            <span class="text-xs font-bold text-emerald-400">${item.num} ${item.title}</span>
            <p class="text-[11px] text-slate-400">${item.subtitle}</p>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-slate-500"></i>
        </div>
      `;
    }
  });
  container.innerHTML = html;
  if (window.lucide) lucide.createIcons();
}

// Search Logic
function handleSearch() {
  const query = document.getElementById('search-input').value.toLowerCase().trim();
  const resultsContainer = document.getElementById('search-results');

  if (!query) {
    resultsContainer.innerHTML = `<p class="text-xs text-slate-500 text-center py-8">បញ្ចូលពាក្យគន្លឹះដើម្បីស្វែងរកមេរៀន...</p>`;
    return;
  }

  let matches = [];
  Object.keys(smcTopicsData).forEach(key => {
    const topic = smcTopicsData[key];
    const matchTitle = topic.title.toLowerCase().includes(query);
    const matchSub = topic.subtitle.toLowerCase().includes(query);
    if (matchTitle || matchSub) {
      matches.push({ key, topic });
    }
  });

  if (matches.length === 0) {
    resultsContainer.innerHTML = `<p class="text-xs text-slate-500 text-center py-8">រកមិនឃើញមេរៀនស្របនឹងពាក្យស្វែងរកឡើយ</p>`;
    return;
  }

  let html = '';
  matches.forEach(m => {
    html += `
      <div onclick="switchTopic('${m.key}'); toggleSearchModal();" class="p-3 bg-slate-950 border border-slate-800 hover:border-emerald-500 rounded-xl cursor-pointer transition flex items-center justify-between">
        <div>
          <span class="text-xs font-bold text-emerald-400">${m.topic.num} ${m.topic.title}</span>
          <p class="text-[11px] text-slate-400">${m.topic.subtitle}</p>
        </div>
        <i data-lucide="arrow-right" class="w-4 h-4 text-emerald-400"></i>
      </div>
    `;
  });
  resultsContainer.innerHTML = html;
  if (window.lucide) lucide.createIcons();
}

// Risk Calculator logic
function calculateRisk() {
  const balance = parseFloat(document.getElementById('calc-balance')?.value) || 0;
  const riskPct = parseFloat(document.getElementById('calc-risk-pct')?.value) || 0;
  const slPips = parseFloat(document.getElementById('calc-sl-pips')?.value) || 1;

  const riskAmount = (balance * (riskPct / 100));
  // Standard Pip value estimate ($10 per pip per std lot on EURUSD)
  const lotSize = (riskAmount / (slPips * 10));

  const resRisk = document.getElementById('res-risk-amount');
  const resLot = document.getElementById('res-lot-size');

  if (resRisk) resRisk.innerText = `$${riskAmount.toFixed(2)}`;
  if (resLot) resLot.innerText = `${lotSize.toFixed(2)} Lots`;
}

// Confluence Score logic
function updateConfluenceScore() {
  const checkboxes = document.querySelectorAll('.conf-check');
  let score = 0;
  checkboxes.forEach(cb => {
    if (cb.checked) score += parseInt(cb.value);
  });

  const scoreText = document.getElementById('conf-score-text');
  const badge = document.getElementById('conf-status-badge');

  if (scoreText) scoreText.innerText = `${score} / 10`;

  if (badge) {
    if (score >= 8) {
      badge.innerText = "A+ Valid Setup ⭐⭐⭐ (រៀបចំចូល Order)";
      badge.className = "px-3 py-1 rounded-lg bg-emerald-950 text-emerald-400 border border-emerald-700 text-xs font-bold";
    } else if (score >= 5) {
      badge.innerText = "B Grade Setup ⭐ (គួរប្រុងប្រយ័ត្ន)";
      badge.className = "px-3 py-1 rounded-lg bg-amber-950 text-amber-400 border border-amber-700 text-xs font-bold";
    } else {
      badge.innerText = "C Grade - មិនទាន់គ្រប់គ្រាន់ ❌ (កុំទាន់ចូល!)";
      badge.className = "px-3 py-1 rounded-lg bg-rose-950 text-rose-400 border border-rose-700 text-xs font-bold";
    }
  }
}

// Journal / Trade Logger
function addTradeLog() {
  const pair = document.getElementById('log-pair')?.value.trim() || 'EURUSD';
  const type = document.getElementById('log-type')?.value || 'BUY';
  const rrr = document.getElementById('log-rrr')?.value.trim() || '1:2';
  const result = document.getElementById('log-result')?.value || 'WIN';

  const newLog = {
    id: Date.now(),
    date: new Date().toLocaleDateString(),
    pair, type, rrr, result
  };

  tradeLogs.unshift(newLog);
  localStorage.setItem('smc_tradelogs', JSON.stringify(tradeLogs));
  renderTradeLogs();

  // Clear input
  if (document.getElementById('log-pair')) document.getElementById('log-pair').value = '';
}

function renderTradeLogs() {
  const container = document.getElementById('logs-container');
  if (!container) return;

  if (tradeLogs.length === 0) {
    container.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">គ្មានកំណត់ត្រាជួញដូរនៅឡើយទេ</p>`;
    return;
  }

  let html = '';
  tradeLogs.forEach(log => {
    const isWin = log.result === 'WIN';
    const isLoss = log.result === 'LOSS';
    const badgeColor = isWin ? 'bg-emerald-950 text-emerald-400 border-emerald-800' : isLoss ? 'bg-rose-950 text-rose-400 border-rose-800' : 'bg-slate-800 text-slate-300 border-slate-700';

    html += `
      <div class="p-2.5 bg-slate-950 border border-slate-800 rounded-xl flex items-center justify-between text-xs">
        <div class="flex items-center gap-2">
          <span class="font-bold text-white">${log.pair}</span>
          <span class="${log.type === 'BUY' ? 'text-emerald-400' : 'text-rose-400'} font-semibold">${log.type}</span>
          <span class="text-slate-500">RRR ${log.rrr}</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="px-2 py-0.5 rounded border ${badgeColor} text-[10px] font-bold">${log.result}</span>
          <button onclick="deleteTradeLog(${log.id})" class="text-slate-600 hover:text-rose-400 p-1">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
  if (window.lucide) lucide.createIcons();
}

function deleteTradeLog(id) {
  tradeLogs = tradeLogs.filter(l => l.id !== id);
  localStorage.setItem('smc_tradelogs', JSON.stringify(tradeLogs));
  renderTradeLogs();
}

// Initial application load
window.addEventListener('DOMContentLoaded', () => {
  renderCurrentTopic();
  updateBookmarkButtonUI();
});
</script>
